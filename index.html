<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnIt | No Detours Studio</title><style>:root{font-family:system-ui;background:#edf2f7;color:#172b42}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;background:#f8fafc;padding-bottom:85px}header{background:#142d4d;color:white;padding:22px;border-radius:0 0 24px 24px}header h1{margin:12px 0 5px}header small{color:#a9d9d1}.content{padding:15px}.card{background:white;border:1px solid #e0e7ef;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #142d4d0a}h2{font-size:17px;margin:0 0 12px}.row{padding:12px 0;border-bottom:1px solid #edf0f4}.row:last-child{border:0}.row strong{display:block}.sub{font-size:12px;color:#697d91}.btn{background:#087f6a;color:white;border:0;border-radius:10px;padding:10px;font-weight:700;margin:4px 4px 4px 0}.btn:disabled{opacity:.45}.alt{background:#e5eef5;color:#23425d}.danger{background:#fbe9e7;color:#ad3931}input,select{width:100%;padding:11px;border:1px solid #ccd8e5;border-radius:10px;margin:5px 0 10px;background:white}label{font-size:12px;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:white;border-top:1px solid #ddd;padding:10px 2px 20px}.nav button{border:0;background:transparent;color:#456;font-size:12px}.nav .active{color:#07836e;font-weight:800}.notice{padding:10px;background:#fff3d9;border-radius:10px;font-size:12px;margin-bottom:12px}.stat{font-size:25px;font-weight:800;color:#126f65}</style><div id="app"></div><script>
const KEY='earnit-pages-v1',seed=()=>({family:'The Parkers',children:[{id:'c1',name:'Mia',age:9},{id:'c2',name:'Alex',age:15}],tasks:[{id:'t1',child:'c1',name:'Make your bed',points:10},{id:'t2',child:'c1',name:'Read for 20 minutes',points:15},{id:'t3',child:'c2',name:'Complete homework',points:0},{id:'t4',child:'c2',name:'Help with dinner',points:0}],rewards:[{id:'r1',child:'c1',name:'Choose family movie',cost:30,kind:'points'},{id:'r2',child:'c2',name:'Extra gaming time',cost:3,kind:'streak'}],submissions:[],redemptions:[]});let s;try{s=JSON.parse(localStorage.getItem(KEY))||seed()}catch{s=seed()}let role='parent',child=s.children[0]?.id,tab='home',message='';const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},id=()=>Math.random().toString(36).slice(2)+Date.now(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c])),person=x=>s.children.find(c=>c.id===x),mode=c=>c.age<12?'Kids':'Teens',points=c=>s.submissions.filter(x=>x.child===c&&x.status==='approved').reduce((n,x)=>n+x.points,0)-s.redemptions.filter(x=>x.child===c&&x.status==='approved'&&x.kind==='points').reduce((n,x)=>n+x.cost,0),streak=c=>{let tasks=s.tasks.filter(t=>t.child===c);if(!tasks.length)return 0;let d=new Date();d.setHours(12,0,0,0);let count=0;for(let i=0;i<365;i++){let date=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(tasks.every(t=>s.submissions.some(x=>x.task===t.id&&x.date===date&&x.status==='approved')))count++;else if(i>0||s.submissions.some(x=>x.child===c&&x.date===date))break;d.setDate(d.getDate()-1)}return count},save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{message='Unable to save in this browser.'}render()},card=(h,b)=>'<section class="card"><h2>'+h+'</h2>'+b+'</section>',button=(t,fn,cls='')=>'<button class="btn '+cls+'" onclick="'+fn+'">'+t+'</button>',childName=c=>esc(person(c)?.name||'Removed child'),taskName=t=>esc(s.tasks.find(x=>x.id===t)?.name||'Removed task');function home(){if(role==='parent')return card('Family overview','<div class="stat">'+s.children.length+' children</div>'+s.children.map(c=>'<div class="row"><strong>'+esc(c.name)+' · '+mode(c)+'</strong><span class="sub">'+(mode(c)==='Kids'?points(c.id)+' points':streak(c.id)+' day streak')+'</span></div>').join(''))+card('Awaiting approval','<div class="stat">'+(s.submissions.filter(x=>x.status==='pending').length+s.redemptions.filter(x=>x.status==='pending').length)+'</div>'+button('Review requests',"go('approvals')"));let c=person(child);if(!c)return card('No profiles','Ask a parent to add a child.');return card('Welcome, '+esc(c.name),'Your '+mode(c)+' experience<div class="stat">'+(mode(c)==='Kids'?points(child)+' points':streak(child)+' day streak')+'</div>')+tasks()+rewards()}function tasks(){return (role==='parent'?card('Add responsibility','<form onsubmit="addTask(event)"><label>Child</label><select name="child">'+s.children.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><label>Task</label><input name="name" required maxlength="80"><label>Points for Kids</label><input name="points" type="number" min="0" max="100" value="10">'+button('Add task','')+'</form>'):'')+card('Responsibilities',s.tasks.filter(t=>role==='parent'||t.child===child).map(t=>{let x=s.submissions.find(x=>x.task===t.id&&x.date===today()&&x.status!=='rejected');return '<div class="row"><strong>'+esc(t.name)+'</strong><span class="sub">'+childName(t.child)+' · '+(mode(person(t.child))==='Kids'?t.points+' points':'Consistency')+' · '+(x?x.status:'Not submitted')+'</span><div>'+(role==='child'?(!x?button('Submit for approval',"submitTask('"+t.id+"')"):''):button('Remove',"removeTask('"+t.id+"')",'danger'))+'</div></div>'}).join('')||'<p class="sub">No responsibilities yet</p>')}function approvals(){return card('Task approvals',s.submissions.filter(x=>x.status==='pending').map(x=>'<div class="row"><strong>'+childName(x.child)+': '+taskName(x.task)+'</strong><span class="sub">'+x.date+'</span><div>'+button('Approve',"decideTask('"+x.id+"',true)")+button('Return',"decideTask('"+x.id+"',false)",'danger')+'</div></div>').join('')||'<p class="sub">All caught up</p>')+card('Reward requests',s.redemptions.filter(x=>x.status==='pending').map(x=>'<div class="row"><strong>'+childName(x.child)+': '+esc(x.name)+'</strong>'+button('Approve',"decideReward('"+x.id+"',true)")+button('Decline',"decideReward('"+x.id+"',false)",'danger')+'</div>').join('')||'<p class="sub">No pending rewards</p>')}function rewards(){return (role==='parent'?card('Add reward','<form onsubmit="addReward(event)"><label>Child</label><select name="child">'+s.children.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><label>Reward</label><input name="name" maxlength="80" required><label>Cost (points or streak days)</label><input name="cost" type="number" min="1" max="365" value="3">'+button('Add reward','')+'</form>'):'')+card('Rewards & privileges',s.rewards.filter(r=>role==='parent'||r.child===child).map(r=>{let eligible=r.kind==='points'?points(r.child)>=r.cost:streak(r.child)>=r.cost,pending=s.redemptions.some(x=>x.reward===r.id&&x.status==='pending');return '<div class="row"><strong>'+esc(r.name)+'</strong><span class="sub">'+childName(r.child)+' · '+r.cost+' '+(r.kind==='points'?'points':'streak days')+'</span><div>'+(role==='parent'?button('Remove',"removeReward('"+r.id+"')",'danger'):button(pending?'Awaiting approval':eligible?'Request reward':'Locked',"requestReward('"+r.id+"')",eligible&&!pending?'':'alt') .replace('<button ','<button '+(eligible&&!pending?'':'disabled ') ))+'</div></div>'}).join('')||'<p class="sub">No rewards yet</p>')}function progress(){return s.children.filter(c=>role==='parent'||c.id===child).map(c=>card(esc(c.name)+' · Progress','<div class="stat">'+(mode(c)==='Kids'?points(c.id)+' points':streak(c.id)+' days')+'</div><p class="sub">'+s.submissions.filter(x=>x.child===c.id&&x.status==='approved').length+' approved completions</p>'+s.submissions.filter(x=>x.child===c.id&&x.status==='approved').slice(-8).reverse().map(x=>'<div class="row">'+taskName(x.task)+' <span class="sub">'+x.date+'</span></div>').join('')+'<h2>Redeemed rewards</h2>'+s.redemptions.filter(x=>x.child===c.id&&x.status==='approved').map(x=>'<div class="row">'+esc(x.name)+'</div>').join(''))).join('')}function family(){return card('Family setup','<form onsubmit="renameFamily(event)"><label>Family name</label><input name="name" value="'+esc(s.family)+'" required>'+button('Save','')+'</form>')+card('Child profiles',s.children.map(c=>'<div class="row"><strong>'+esc(c.name)+'</strong><span class="sub">Age '+c.age+' · '+mode(c)+'</span> '+button('Remove',"removeChild('"+c.id+"')",'danger')+'</div>').join(''))+card('Add child','<form onsubmit="addChild(event)"><label>Name</label><input name="name" required maxlength="40"><label>Age</label><input name="age" type="number" min="5" max="17" value="10">'+button('Add child','')+'</form>')+card('Demo data','All information stays in this browser. '+button('Reset sample family','resetDemo()','danger'))}function render(){if(role==='child'&&!person(child))child=s.children[0]?.id;if(role==='child'&&(tab==='family'||tab==='approvals'))tab='home';let tabs=role==='parent'?['home','tasks','approvals','rewards','progress','family']:['home','tasks','rewards','progress'];document.getElementById('app').innerHTML='<div class="app"><header><strong>Earn<span style="color:#4de0b0">It</span></strong><small> · No Detours Studio</small><h1>'+({home:'Dashboard',tasks:'Responsibilities',approvals:'Approvals',rewards:'Rewards',progress:'Progress',family:'Family setup'})[tab]+'</h1><select onchange="role=this.value;go(\'home\')"><option value="parent" '+(role==='parent'?'selected':'')+'>Parent demo</option><option value="child" '+(role==='child'?'selected':'')+'>Child demo</option></select>'+(role==='child'?'<select onchange="child=this.value;go(\'home\')">'+s.children.map(c=>'<option value="'+c.id+'" '+(c.id===child?'selected':'')+'>'+esc(c.name)+' · '+mode(c)+'</option>').join('')+'</select>':'')+'</header><main class="content"><div class="notice">Prototype only. No secure accounts or synchronization. Use fictional sample data.</div>'+(message?'<div class="notice">'+esc(message)+'</div>':'')+({home,tasks,approvals,rewards,progress,family})[tab]()+'</main><nav class="nav">'+tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="go(\''+t+'\')">'+({home:'🏠',tasks:'☑️',approvals:'📥',rewards:'🎁',progress:'📈',family:'⚙️'})[t]+'<br>'+t+'</button>').join('')+'</nav></div>'}function go(t){tab=t;message='';render()}function submitTask(t){if(s.submissions.some(x=>x.task===t&&x.date===today()&&x.status!=='rejected'))return;let task=s.tasks.find(x=>x.id===t);if(!task)return;s.submissions.push({id:id(),task:t,child:task.child,date:today(),points:task.points,status:'pending'});save()}function decideTask(i,ok){let x=s.submissions.find(x=>x.id===i);if(x&&x.status==='pending'){x.status=ok?'approved':'rejected';save()}}function requestReward(i){let r=s.rewards.find(x=>x.id===i);if(!r||s.redemptions.some(x=>x.reward===i&&x.status==='pending')||(r.kind==='points'?points(r.child)<r.cost:streak(r.child)<r.cost))return;s.redemptions.push({id:id(),reward:i,child:r.child,name:r.name,kind:r.kind,cost:r.cost,status:'pending'});save()}function decideReward(i,ok){let x=s.redemptions.find(x=>x.id===i);if(!x||x.status!=='pending')return;if(ok&&x.kind==='points'&&points(x.child)<x.cost){message='Insufficient points';return render()}x.status=ok?'approved':'rejected';save()}function addTask(e){e.preventDefault();let f=e.target,c=person(f.elements.child.value),n=f.elements.name.value.trim(),p=Number(f.elements.points.value);if(!c||!n||!Number.isInteger(p)||p<0||p>100)return;s.tasks.push({id:id(),child:c.id,name:n,points:mode(c)==='Kids'?p:0});save()}function addReward(e){e.preventDefault();let f=e.target,c=person(f.elements.child.value),n=f.elements.name.value.trim(),cost=Number(f.elements.cost.value);if(!c||!n||!Number.isInteger(cost)||cost<1||cost>365)return;s.rewards.push({id:id(),child:c.id,name:n,cost,kind:mode(c)==='Kids'?'points':'streak'});save()}function addChild(e){e.preventDefault();let f=e.target,n=f.elements.name.value.trim(),age=Number(f.elements.age.value);if(!n||!Number.isInteger(age)||age<5||age>17)return;s.children.push({id:id(),name:n,age});save()}function renameFamily(e){e.preventDefault();let n=e.target.elements.name.value.trim();if(n){s.family=n;save()}}function removeTask(i){if(confirm('Remove this responsibility?')){s.tasks=s.tasks.filter(x=>x.id!==i);save()}}function removeReward(i){if(confirm('Remove this reward?')){s.rewards=s.rewards.filter(x=>x.id!==i);save()}}function removeChild(i){if(confirm('Remove child and related data?')){s.children=s.children.filter(x=>x.id!==i);s.tasks=s.tasks.filter(x=>x.child!==i);s.rewards=s.rewards.filter(x=>x.child!==i);s.submissions=s.submissions.filter(x=>x.child!==i);s.redemptions=s.redemptions.filter(x=>x.child!==i);save()}}function resetDemo(){if(confirm('Reset local demo data?')){s=seed();child='c1';role='parent';tab='home';save()}}render();
</script></html>
